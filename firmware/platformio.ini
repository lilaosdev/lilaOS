[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = spiffs

lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  lovyan03/LovyanGFX@^1.2.7
  earlephilhower/ESP8266Audio@^1.9.7
  bitbank2/AnimatedGIF@^2.2.0

build_flags =
  -D APP_VERSION=\"0.1.0\"
